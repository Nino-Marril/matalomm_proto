.hd{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--ln);background:var(--fr)}
.hd .ht{flex:1;text-align:center}.hd .ht b{display:block;font-size:15px}.hd .ht span{color:var(--mut);font-size:11px}
.sb{display:flex;justify-content:flex-end;gap:12px;padding:5px 14px;background:var(--fill);border-bottom:1px solid var(--ln);font-size:12px;color:var(--mut)}
.sb a{color:var(--ink);text-decoration:underline;cursor:pointer}
.bd{display:flex;min-height:70vh}
nav{width:190px;flex:none;border-right:1px solid var(--ln);background:var(--fr);padding:12px 8px}
nav small{display:block;color:var(--mut);font-size:10px;margin:10px 6px 4px;letter-spacing:.05em}
nav div{padding:8px 10px;border-radius:3px;border-left:3px solid transparent;cursor:pointer}
nav div.on{background:var(--fill);font-weight:600;border-left-color:var(--dk)}
main{flex:1;padding:16px;min-width:0}
h2{margin:0 0 2px;font-size:21px}.sub{color:var(--mut);font-size:12px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pn{background:var(--fr);border:1px solid var(--ln);border-radius:4px;padding:12px;margin-bottom:12px}
.pn h3{margin:0 0 4px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--fr);border:1px solid var(--ln);border-radius:4px;padding:8px 10px}.stat b{font-size:22px;display:block}.stat span{color:var(--mut);font-size:11px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--fill);text-align:left;padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
td{padding:7px 8px;border-top:1px solid var(--ln)}td.fx{background:var(--fill);color:var(--mut);text-align:center}
td.up{border:2px dashed var(--mut);text-align:center;font-weight:600}tr.sel td{background:var(--fill)}
.btn{border:1px solid var(--ln);background:var(--fr);color:var(--ink);padding:7px 14px;border-radius:3px;margin:2px 4px 2px 0;font:inherit;font-size:13px;cursor:pointer}
.btn.p{background:var(--dk);color:var(--fr);border-color:var(--dk)}.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;border:1px solid var(--ln);background:var(--fill);padding:1px 8px;border-radius:9px;font-size:11px}
.note{background:var(--fill);border:1px solid var(--ln);border-radius:4px;padding:8px 10px;margin:8px 0;font-size:13px}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:6px}
input,select{display:block;width:100%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--ln);border-radius:3px;background:var(--fr);color:var(--ink);margin-top:2px}
input[type=checkbox]{display:inline;width:auto;margin-right:6px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.cards .pn{cursor:pointer;margin:0}
.lw{max-width:420px;margin:24px auto;padding:0 12px}.tabs{display:flex;gap:4px;margin-bottom:8px}.tabs .btn.on{background:var(--dk);color:var(--fr)}
.chips .btn{font-size:12px;padding:5px 10px}.err{color:#b33;font-size:13px;min-height:18px}
.wm{position:relative}.wm::after{content:"FOR VIEWING ONLY";position:absolute;inset:0;display:grid;place-items:center;font-size:36px;font-weight:700;color:rgba(128,128,128,.14);transform:rotate(-18deg);pointer-events:none}
.ft{text-align:center;color:var(--mut);font-size:11px;padding:10px}
@media (max-width:720px){.bd{flex-direction:column}nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:6px}nav small{display:none}nav div{white-space:nowrap}}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-height:230px;overflow:auto;border:1px solid var(--ln);padding:8px;border-radius:4px;margin-bottom:10px}.ce{border:1px solid var(--ln);background:var(--fr);padding:6px 8px;border-radius:3px;text-align:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cam{border:2px dashed var(--ln);background:var(--fill);min-height:230px;display:grid;place-items:center;text-align:center;padding:10px;color:var(--mut)}.fb{border:1px solid var(--ln);background:var(--fr);padding:6px 10px;border-radius:3px;margin-bottom:8px}.fb small{display:block;color:var(--mut);font-size:11px}.th{display:inline-grid;place-items:center;width:46px;height:46px;background:var(--fill);border:1px solid var(--ln);object-fit:cover;font-size:10px;color:var(--mut)}.sf{font-size:12px}.sf h4{margin:12px 0 4px;text-align:center}.sh{text-align:center;line-height:1.3}@media (max-width:720px){.g2{grid-template-columns:1fr}}</style></head><body><div id="app"></div>

R: Admitted in ________ Date ______</div></div>'}
